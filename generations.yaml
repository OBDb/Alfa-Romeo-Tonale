    description: "The Alfa Romeo Tonale is the brand's first compact crossover SUV and marks Alfa Romeo's entry into electrification. Produced since February 2022, it is built on the FCA Small Wide 4×4 LWB platform (model code 965). Named after the Tonale mountain pass in Northern Italy, the Tonale features distinctive Alfa Romeo styling with the signature 'Scudetto' shield grille, 3+3 LED headlights inspired by the SZ and Brera, and a wraparound taillight design. It's available with various powertrain options including a 1.3L turbocharged plug-in hybrid system offering approximately 30 miles of electric-only range, as well as 1.5L and 2.0L turbocharged petrol engines, and 1.6L diesel options. The interior showcases a driver-focused cockpit with a 10.25-inch touchscreen running Uconnect 5 software and a 12.3-inch digital instrument cluster. The Tonale emphasizes driving dynamics with a very quick steering rack (2.3 turns lock-to-lock), torque vectoring by braking, and frequency-selective dampers. In August 2022, a rebadged North American version was unveiled as the Dodge Hornet."
